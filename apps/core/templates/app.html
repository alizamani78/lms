<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<title>سامانه مدیریت آموزش رضوی</title>
<style nonce="{{ nonce }}">
/* ===== Razavi LMS — organizational design system (light / dark / system). No external fonts or scripts. ===== */
:root{
  --bg:#f3f5f8;--card:#ffffff;--ink:#16212e;--mute:#5d6b7a;--line:#e2e8ef;--field:#ffffff;
  --brand:#0b5d4b;--brand-2:#0f766e;--brand-soft:#e5f2ef;--gold:#b8892b;--err:#b3261e;--err-soft:#fdecea;
  --ok-soft:#e6f5ec;--warn-soft:#fff4e0;--shadow:0 1px 2px rgba(16,33,46,.05),0 8px 24px rgba(16,33,46,.06);
  --radius:14px;--side:264px;color-scheme:light;
}
[data-theme=dark]{--bg:#0a111b;--card:#111b29;--ink:#e8eef6;--mute:#93a3b6;--line:#223248;--field:#0d1623;
  --brand:#52c2aa;--brand-2:#2aa58e;--brand-soft:#12303a;--gold:#e0b04a;--err:#ff8a80;--err-soft:#3b1a1a;
  --ok-soft:#10301f;--warn-soft:#3a2a10;--shadow:none;color-scheme:dark}
@media (prefers-color-scheme:dark){[data-theme=system]{--bg:#0a111b;--card:#111b29;--ink:#e8eef6;--mute:#93a3b6;
  --line:#223248;--field:#0d1623;--brand:#52c2aa;--brand-2:#2aa58e;--brand-soft:#12303a;--gold:#e0b04a;--err:#ff8a80;
  --err-soft:#3b1a1a;--ok-soft:#10301f;--warn-soft:#3a2a10;--shadow:none;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.8 Vazirmatn,"IRANSansX","IRANSans","Segoe UI",Tahoma,system-ui,sans-serif}
a{color:var(--brand)}
code{background:var(--brand-soft);color:var(--brand);padding:2px 8px;border-radius:6px;direction:ltr;display:inline-block;word-break:break-all}

/* ---- top bar ---- */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:10px 20px;
  background:linear-gradient(110deg,#07463a 0%,var(--brand) 55%,var(--brand-2) 100%);color:#fff;
  border-bottom:3px solid var(--gold);box-shadow:0 6px 20px rgba(7,70,58,.25)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:22px;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35)}
.brand-t{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.brand-t b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-t small{opacity:.85;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{margin-inline-start:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.topbar select,.topbar .themesel,.topbar .ksel{width:auto;max-width:210px;margin:0;padding:6px 10px;border-radius:10px;
  background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35)}
.topbar select option{color:#16212e}
.userchip{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 6px;border-radius:999px;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.3);font-size:13px}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#fff;font-weight:700}
.topbar button,.topbar a.btn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:10px;
  padding:6px 14px;font:inherit;cursor:pointer;text-decoration:none}
.topbar button:hover,.topbar a.btn:hover{background:rgba(255,255,255,.26)}
.burger{display:none}

/* ---- layout: sidebar + content ---- */
.layout{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:calc(100vh - 66px)}
.sidebar{background:var(--card);border-inline-end:1px solid var(--line);padding:14px 12px 28px;position:sticky;top:66px;
  height:calc(100vh - 66px);overflow:auto}
.sidebar .grp{margin:16px 8px 6px;font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.3px;display:flex;gap:8px;align-items:center}
.sidebar .grp::after{content:"";flex:1;height:1px;background:var(--line)}
.sidebar .item{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:none;border:0;border-radius:11px;
  padding:9px 12px;cursor:pointer;font:inherit;color:var(--ink);transition:background .15s,color .15s}
.sidebar .item:hover{background:var(--brand-soft)}
.sidebar .item.on{background:linear-gradient(90deg,var(--brand-soft),transparent);color:var(--brand);font-weight:700;
  box-shadow:inset -3px 0 0 var(--gold)}
.sidebar .ico{width:22px;text-align:center;flex:none}
.content{min-width:0;padding:22px 26px 60px;max-width:1180px;width:100%;margin:0 auto}
.pagehead{display:flex;align-items:baseline;gap:10px;margin:0 0 14px}
.pagehead h1{margin:0;font-size:21px}.pagehead span{color:var(--mute);font-size:13px}

/* ---- cards, forms, buttons ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px;
  box-shadow:var(--shadow);overflow-x:auto}
.card h2{margin:0 0 12px;padding-bottom:10px;font-size:16.5px;font-weight:700;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:5px;height:18px;border-radius:3px;background:linear-gradient(var(--brand),var(--gold))}
label{display:block;margin:12px 0 5px;color:var(--mute);font-size:13px;font-weight:600}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--field);
  color:var(--ink);transition:border-color .15s,box-shadow .15s}
input{direction:ltr;text-align:right}input.fa{direction:rtl}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-2) 22%,transparent)}
textarea{min-height:92px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--brand-2)}
button.p{background:linear-gradient(110deg,var(--brand),var(--brand-2));color:#fff;border:0;border-radius:10px;padding:10px 22px;
  font:inherit;font-weight:700;cursor:pointer;margin-top:12px;box-shadow:0 4px 12px color-mix(in srgb,var(--brand) 30%,transparent);
  transition:transform .1s,filter .15s}
button.p:hover{filter:brightness(1.07)}button.p:active{transform:translateY(1px)}button.p:disabled{opacity:.5;cursor:not-allowed}
button.s{background:transparent;color:var(--brand);border:1px solid var(--brand);border-radius:10px;padding:6px 14px;font:inherit;
  font-weight:600;cursor:pointer}
button.s:hover{background:var(--brand-soft)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.row input,.row select{width:auto;min-width:150px}
.muted{color:var(--mute)}.pre{white-space:pre-wrap}.hide{display:none!important}
.msg{margin-top:10px;padding:9px 14px;border-radius:10px;background:var(--brand-soft);color:var(--brand);font-weight:600}
.msg.err{background:var(--err-soft);color:var(--err)}.msg.hi{background:var(--ok-soft)}
.chain{display:flex;gap:6px;flex-wrap:wrap}.chain span{background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:1px 12px;font-size:13px}
.q{padding:13px 0;border-bottom:1px solid var(--line)}.q:last-child{border-bottom:0}
.opt{display:flex;gap:8px;align-items:center;padding:4px 0;cursor:pointer;margin:0;color:var(--ink);font-size:15px;font-weight:400}
.opt select{width:auto}.timer{font-weight:800;color:var(--brand);font-size:17px}
.photo{width:96px;height:96px;object-fit:cover;border-radius:14px;border:2px solid var(--line)}

/* ---- tables ---- */
table{width:100%;border-collapse:separate;border-spacing:0}
th,td{text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:color-mix(in srgb,var(--brand-soft) 70%,var(--card));color:var(--mute);font-weight:700;font-size:13px;white-space:nowrap}
th:first-child{border-start-start-radius:10px}th:last-child{border-start-end-radius:10px}
tbody tr:hover td,tr:hover>td{background:color-mix(in srgb,var(--brand-soft) 45%,transparent)}
td select,td input{min-width:120px;margin-bottom:4px}
.ok td{background:var(--ok-soft)}.bad td{background:var(--err-soft)}.today{background:var(--brand-soft)}

/* ---- dual date picker, calendar ---- */
.dual{border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:4px;background:var(--field)}
.dual .row{margin:6px 0}.dual input[type=number],.dual input[type=time],.dual input[type=date],.dual select{width:auto}
.cal{table-layout:fixed}.cal td{height:88px;vertical-align:top;font-size:12px;border:1px solid var(--line)}
.cal th.fri,.cal td.fri{color:var(--err)}
.ev{display:block;border-radius:5px;padding:0 5px;margin-top:2px;font-size:11px;overflow:hidden}
.ev-holiday{background:var(--err-soft);color:var(--err)}.ev-closure{background:var(--warn-soft);color:#b25e00}
.ev-exams{background:#e3f0fb;color:#0b5394}.ev-event{background:var(--brand-soft);color:var(--brand)}

/* ---- dashboard tiles ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-top:6px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);overflow:hidden}
.tile::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--brand),var(--gold))}
.tile .tn{font-size:28px;font-weight:800;color:var(--brand)}.tile .tl{color:var(--mute);font-size:13px}

/* ---- sign-in screens (login / recovery / MFA): brand panel + card ---- */
.login{display:grid;grid-template-columns:1.15fr 1fr;min-height:100vh;align-items:center;gap:0;padding:0}
.login::before{content:"سامانه مدیریت آموزش\A استان خراسان رضوی\A\A مدارس · کلاس‌ها · آزمون‌ها · ارزشیابی · گزارش‌ها";
  white-space:pre;align-self:stretch;display:flex;align-items:center;justify-content:center;text-align:center;font-size:25px;
  line-height:2;font-weight:800;color:#fff;padding:40px;background:
  radial-gradient(circle at 20% 15%,rgba(255,255,255,.12),transparent 40%),
  linear-gradient(145deg,#06382f,var(--brand) 55%,var(--brand-2));border-inline-end:4px solid var(--gold)}
.login>.card{max-width:420px;width:calc(100% - 40px);margin:0 auto}
.login .card{padding:28px}
.login .card h2{font-size:19px}

/* ---- responsive ---- */
@media (max-width:980px){
  .layout{grid-template-columns:1fr}
  .burger{display:inline-block}
  .sidebar{position:fixed;inset-block:66px 0;inset-inline-start:0;width:280px;z-index:45;transform:translateX(110%);transition:transform .2s;
    box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .sidebar.open{transform:none}
  .content{padding:16px 14px 50px}
  .brand-t small{display:none}
  .login{grid-template-columns:1fr}.login::before{min-height:150px;font-size:17px;padding:20px;white-space:pre-line}
}
@media (max-width:560px){.userchip span.nm{display:none}.top-actions{gap:5px}.topbar{padding:8px 10px}}
.ev.editable{cursor:pointer;text-decoration:underline dotted}.cal td.clickable{cursor:pointer}.cal td.clickable:hover{background:var(--brand-soft)}
.qrbox{display:flex;justify-content:center;margin:10px 0}.qrbox svg{background:#fff;border:6px solid #fff;border-radius:12px;box-shadow:0 0 0 1px var(--line);max-width:100%;height:auto}

/* ---- collapsible sidebar groups ---- */
.sidebar .grp{width:100%;background:none;border:0;cursor:pointer;font:inherit;text-align:right;padding:8px 8px;margin:6px 0 2px;border-radius:9px}
.sidebar .grp:hover{background:var(--brand-soft)}
.sidebar .grp::after{content:none}
.sidebar .grp .chev{margin-inline-start:auto;transition:transform .15s;color:var(--mute);font-size:11px}
.sidebar .grp.open .chev{transform:rotate(90deg)}
.sidebar .grpbody{display:flex;flex-direction:column;gap:1px;padding-inline-start:6px;border-inline-start:2px solid var(--line);margin-inline-start:14px}
/* ---- editors and pickers ---- */
.rte-wrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--field)}
.rte-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;background:color-mix(in srgb,var(--brand-soft) 60%,var(--card));border-bottom:1px solid var(--line)}
.rte-bar select{width:auto;padding:4px 8px}.rte-bar input[type=color]{width:34px;height:30px;padding:0;border-radius:8px}
.rte-bar button.s,.filebtn{padding:3px 10px;font-weight:700}
.filebtn{display:inline-block;border:1px solid var(--brand);color:var(--brand);border-radius:10px;cursor:pointer;margin:0;font-size:14px}
.filebtn input{display:none}
.rte{min-height:220px;max-height:60vh;overflow:auto;padding:14px 16px;outline:none;line-height:2}
.rte img,.richbox img{max-width:100%;border-radius:10px;margin:6px 0}.rte audio,.richbox audio{width:100%;margin:6px 0}
.richbox{line-height:2;padding:6px 2px}
.cascade{display:flex;flex-direction:column;gap:6px}
.cascade select,.cascade input{margin:0}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:3px 12px;margin:3px 0}
.qrow{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}.qrow>*{min-width:0}
.pair{display:flex;gap:10px;align-items:center;margin:6px 0}.pair-left{flex:1;min-width:0}.drag{cursor:grab;user-select:none}
.fx{font-family:Consolas,monospace;direction:ltr;display:inline-block;background:var(--brand-soft);padding:0 6px;border-radius:6px}
.richbox table,.rte table{border-collapse:collapse}.richbox td,.richbox th,.rte td,.rte th{border:1px solid var(--line);padding:4px 8px}
.prev{max-width:100%;max-height:420px;border-radius:12px;margin-top:8px;display:block}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:2px 18px}
.fgrid .wide{grid-column:1/-1}
.fset{border:1px solid var(--line);border-radius:12px;padding:6px 16px 14px;margin:0 0 16px}
.fset>legend{padding:0 10px;font-weight:700;color:var(--brand)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;margin:0 0 12px}
.filters>div{min-width:180px}.filters .cascade{min-width:200px}
.hint{background:var(--warn-soft);border-radius:10px;padding:8px 12px;margin:8px 0;color:var(--ink)}
.req{color:var(--err)}.reqlabel::after{content:' *';color:var(--err);font-weight:800}
/* ---- Jalali picker and calendar occasions ---- */
.jp{position:relative;min-width:220px}.jp-row{display:flex;gap:6px}.jp-in{cursor:pointer;background:var(--field)}
.jp-pop{position:fixed;z-index:9999;max-height:88vh;overflow:auto;top:100%;inset-inline-start:0;margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:10px;width:300px}
.jp-head{position:sticky;top:0;background:var(--card);z-index:1;display:flex;align-items:center;gap:6px;justify-content:space-between;margin-bottom:8px}.jp-head b{flex:1;text-align:center}
.jp-nav{width:32px;height:32px;padding:0;border-radius:10px;font-size:18px}
.jp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.jp-wd{text-align:center;font-size:12px;color:var(--mute);font-weight:700}.jp-wd.fri{color:var(--err)}
.jp-day{padding:6px 0;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--ink);font-weight:600}
.jp-day:hover{background:var(--brand-soft)}.jp-day.fri{color:var(--err)}.jp-day.today{border-color:var(--brand)}.jp-day.on{background:var(--brand);color:#fff}
.jp-foot{display:flex;gap:6px;justify-content:space-between;margin-top:8px}
.occ{display:block;font-size:11px;border-radius:6px;padding:1px 5px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.occ-holiday{background:#fde2e2;color:#8a1111}.occ-national{background:#dbeafe;color:#1e3a8a}.occ-religious{background:#dcfce7;color:#14532d}.occ-school{background:#ede9fe;color:#4c1d95}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.legend .occ{display:inline-block;margin:0}
/* ---- monitor gauges ---- */
.gbar{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.gfill{height:100%;background:var(--brand-2);border-radius:6px;transition:width .4s}
.gfill.warm{background:var(--gold)}.gfill.hot{background:var(--err)}
/* ---- required fields that are still empty ---- */
.field-missing input,.field-missing select,.field-missing textarea,.field-missing .rte-wrap{border-color:var(--err);background:var(--err-soft)}
.field-missing label{color:var(--err);font-weight:800}
/* headings use the title face when it is installed (Titr / Zar) */
h1,h2,h3,.tile .tn{font-family:Titr,Zar,"Sans Serif","IRANSans",Tahoma,sans-serif}
.lesson{border-radius:8px;padding:4px 6px;margin:2px 0;color:#111827;font-size:13px}
.sec-head{border:1px solid var(--ds-line,#e2e8f0);border-radius:12px;padding:10px 14px;margin:12px 0;background:#f8fafc}.sec-ins{font-weight:400;font-size:13px;margin-top:6px}
.bars{margin:8px 0}.bar-row{display:flex;align-items:center;gap:10px;margin:6px 0}.bar-label{flex:0 0 35%;min-width:0;font-size:13px}.bar-track{flex:1;height:12px;background:var(--line);border-radius:8px;overflow:hidden}.bar-fill{height:100%;background:var(--brand-2);border-radius:8px}.bar-fill.weak{background:var(--err)}.bar-val{flex:0 0 52px;text-align:left;font-weight:700}
/* ---- form fields sit side by side: two per row on a normal screen, three on a wide one; long fields take the full row ---- */
.card>.field{display:inline-block;vertical-align:top;width:calc(50% - 8px);margin:0 0 10px 8px;box-sizing:border-box}
@media (min-width:1200px){.card>.field{width:calc(33.33% - 8px)}}
@media (max-width:640px){.card>.field{width:100%;margin-inline-start:0}}
.field input,.field select{width:100%}
.field:has(textarea),.field:has(.rte-wrap),.field:has(table),.field:has(select[multiple]),.field:has(.jp-pop){width:100%}
/* ---- filter and selection boxes: one height everywhere, several per row, responsive, never stretched ---- */
select,input[type=text],input[type=number],input[type=time],input[type=date],.jp-in,.col-filter{height:40px;min-height:40px;max-height:40px;box-sizing:border-box;max-width:100%;padding:6px 10px;border-radius:10px}
textarea{box-sizing:border-box;max-width:100%}
.cascade{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;width:100%}
.cascade>*{flex:1 1 180px;min-width:150px;max-width:100%;box-sizing:border-box}
.cascade>*>label,.cascade>label{display:block;font-size:12px;margin-bottom:4px}
.cascade select,.cascade input{width:100%}
.cascade .hide{display:none!important}
.field .cascade{margin-top:4px}
.form-row>*,.filters>*{flex:1 1 180px;min-width:150px;max-width:100%}
.card>.field{vertical-align:top}
.card>.field>label{display:block;margin-bottom:4px}
/* ---- forms in neat rows: the school's own fields line up in rows of three; the school cascade (province, region, school) takes its own full row ---- */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 16px;align-items:start}
.fgrid>.field{min-width:0}
.fgrid>.field:has(.cascade){grid-column:1/-1}
.fgrid label,.field>label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px;font-weight:600}
@media (min-width:900px){.card>.field{width:calc(33.33% - 10px)}}
@media (max-width:899px) and (min-width:641px){.card>.field{width:calc(50% - 8px)}}
.field:has(.cascade){width:100%}
/* =====================================================================================
   FORM ROWS EVERYWHERE: any box that holds labelled fields lays them out side by side (auto-fit columns);
   long fields (cascade, text areas, editors, tables, multi-select) take a whole row. Works on every page.
   ===================================================================================== */
.card>.field,.fgrid>.field,.form-row>.field{width:auto;display:block;margin:0;vertical-align:initial}
.card:has(> .field){display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px 16px;align-items:start}
.card:has(> .field)>:not(.field){grid-column:1/-1}
.card div:has(> .field),.fgrid,.form-row,.filters,.cascade{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px 16px;align-items:start}
.cascade{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.cascade>*{flex:1 1 170px;min-width:150px}
.field:has(.cascade>*:nth-child(3)),.field:has(textarea),.field:has(.rte-wrap),.field:has(table),.field:has(.jp-pop),.field:has(.fgrid),.field:has(.form-row){grid-column:1/-1}
.chk-row{display:flex;align-items:center;gap:6px;padding:4px 0;font-weight:400}
/* several choices (grades and fields of a subject) sit side by side, each a tall list */
.field:has(select[multiple]) select[multiple]{height:auto;min-height:130px}
.field:has(.cascade>*:nth-child(2):not(:nth-child(3))){grid-column:span 2}

.card div:has(> .field)>.field{min-width:0}
/* ---- search-and-pick box: the search text and its results are one box (one border, one background) ---- */
.picker{display:flex;flex-direction:column;gap:8px;border:1px solid #cbd5e1;border-radius:var(--ds-radius-sm,10px);padding:10px;background:#f8fafc;box-sizing:border-box;width:100%}
.picker>input,.picker>select{background:#fff;width:100%}
.picker:focus-within{border-color:var(--ds-brand-2,#14806b);box-shadow:0 0 0 3px rgba(20,128,107,.15)}

/* ---- province, region and school sit in one row; the school search lives inside the school box ---- */
.cascade{display:flex!important;flex-direction:row!important;flex-wrap:wrap!important;gap:10px!important;align-items:flex-end!important;width:100%}
.cascade>*{flex:1 1 0!important;min-width:150px!important;width:auto!important;max-width:100%!important;box-sizing:border-box}
.cascade>select{height:40px}
.cascade>.picker{flex:2 1 260px!important}
.cascade>.picker>select,.cascade>.picker>input{height:40px;width:100%}
/* ---- the school list is ONE box: a small search line at its top, then the list (no separate boxes) ---- */
.cascade>.picker,.picker.list-box{display:flex;flex-direction:column;gap:0;padding:0;overflow:hidden;background:#fff;border:1px solid #cbd5e1;border-radius:10px}
.cascade>.picker>input,.picker.list-box>input{height:34px;min-height:34px;max-height:34px;border:0;border-bottom:1px solid #e2e8f0;border-radius:0;background:#f8fafc;padding:6px 12px;font-size:12px;width:100%;box-sizing:border-box}
.cascade>.picker>select,.picker.list-box>select{height:40px;min-height:40px;border:0;border-radius:0;background:#fff;width:100%;box-sizing:border-box;padding:6px 12px}
.cascade>.picker>input:focus,.cascade>.picker>select:focus,.picker.list-box>input:focus,.picker.list-box>select:focus{box-shadow:none;outline:none}
.cascade>.picker:focus-within{border-color:var(--ds-brand-2,#14806b);box-shadow:0 0 0 3px rgba(20,128,107,.15)}
/* ---- search and filter fields sit in one or two rows on every page (not stacked) ---- */
.cascade,.form-row,.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.cascade>*,.form-row>*,.filters>*{flex:1 1 170px;min-width:140px}
.cascade select,.cascade input,.form-row select,.form-row input,.filters select,.filters input{width:100%}
.cascade .hide,.form-row .hide,.filters .hide{display:none!important}
/* =====================================================================================
   DESIGN SYSTEM (one look for the whole site): tokens, typography, surfaces, buttons, forms,
   tables, messages, navigation and the login page. CSS only; it overrides earlier rules.
   ===================================================================================== */
/* ---- the site's font (Vazirmatn, bundled from /static/fonts; falls back to the system faces if the files are missing) ---- */
@font-face{font-family:"VazirSite";src:url("/static/fonts/Vazirmatn-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"VazirSite";src:url("/static/fonts/Vazirmatn-Bold.woff2") format("woff2");font-weight:700 800;font-style:normal;font-display:swap}
@font-face{font-family:"IRANSansSite";src:url("/static/fonts/IRANSansWeb_FaNum_.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"IRANSansSite";src:url("/static/fonts/IRANSansWeb_FaNum__Bold.woff2") format("woff2");font-weight:700 800;font-style:normal;font-display:swap}
:root{
  --ds-brand:#0f5c4d; --ds-brand-2:#14806b; --ds-brand-soft:#e8f5f1; --ds-accent:#c9a227;
  --ds-ink:#0f172a; --ds-mute:#64748b; --ds-line:#e2e8f0; --ds-card:#ffffff; --ds-bg:#f5f7f9;
  --ds-err:#b91c1c; --ds-err-soft:#fde8e8; --ds-ok:#166534; --ds-ok-soft:#dcfce7; --ds-warn:#a16207; --ds-warn-soft:#fef3c7;
  --ds-radius:14px; --ds-radius-sm:10px; --ds-shadow:0 1px 2px rgba(15,23,42,.05),0 6px 20px -10px rgba(15,23,42,.14);
  --ds-font:"VazirSite","Vazirmatn","IRANSansSite","Sans Serif",Tahoma,sans-serif;
  --ds-title:"VazirSite","Vazirmatn","IRANSansSite",Tahoma,sans-serif;
}
html,body{font-family:var(--ds-font);color:var(--ds-ink);background:var(--ds-bg)}
h1,h2,h3,h4,.th-title,.tile .tn,.brand-title{font-family:var(--ds-title);font-weight:800;letter-spacing:0;color:var(--ds-ink)}
h2{font-size:19px;margin:0 0 12px}
h3{font-size:15px;margin:18px 0 8px;color:var(--ds-brand)}
p,td,li,.muted,.hint,label{font-weight:400}
label{font-size:12px;color:var(--ds-mute);font-weight:600;margin-bottom:4px;display:block}
/* surfaces */
.card{background:var(--ds-card);border:1px solid var(--ds-line);border-radius:var(--ds-radius);box-shadow:var(--ds-shadow);padding:18px 20px;margin-bottom:16px}
.tile{background:var(--ds-card);border:1px solid var(--ds-line);border-radius:var(--ds-radius);box-shadow:var(--ds-shadow);padding:14px 16px}
.tile .tl{font-size:12px;color:var(--ds-mute);font-weight:600}
.tile .tn{font-size:24px;font-weight:800;color:var(--ds-brand)}
.hint{background:var(--ds-brand-soft);color:var(--ds-ink);border-radius:var(--ds-radius-sm);padding:9px 12px;margin:0 0 12px;border-inline-start:3px solid var(--ds-brand-2);font-size:13px}
/* buttons: primary, secondary (s), danger */
button{font-family:var(--ds-font);font-size:13px;font-weight:600;border-radius:var(--ds-radius-sm);cursor:pointer;transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s;border:1px solid var(--ds-line);background:#fff;color:var(--ds-ink);padding:8px 14px;min-height:36px}
button:hover:not([disabled]){border-color:var(--ds-brand-2);color:var(--ds-brand)}
button.p{background:var(--ds-brand);border-color:var(--ds-brand);color:#fff}
button.p:hover:not([disabled]){background:var(--ds-brand-2);border-color:var(--ds-brand-2);color:#fff}
button.s{background:#fff;color:var(--ds-brand);border-color:#b7d8cf}
button.s:hover:not([disabled]){background:var(--ds-brand-soft)}
button.danger,button.s.danger{color:var(--ds-err);border-color:#f3b4b4;background:#fff}
button.danger:hover:not([disabled]),button.s.danger:hover:not([disabled]){background:var(--ds-err-soft);border-color:var(--ds-err)}
button[disabled]{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(20,128,107,.25)}
/* inputs */
input,select,textarea{font-family:var(--ds-font);font-size:13px;color:var(--ds-ink);background:#fff;border:1px solid #cbd5e1;border-radius:var(--ds-radius-sm);transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:#94a3b8}
input:focus,select:focus,textarea:focus{border-color:var(--ds-brand-2)}
select,input[type=text],input[type=number],input[type=time],input[type=date],.jp-in,.col-filter{height:40px;min-height:40px;max-height:40px;box-sizing:border-box;padding:6px 10px;width:100%}
textarea{padding:8px 10px;min-height:90px;box-sizing:border-box;width:100%}
.col-filter{height:32px;min-height:32px;max-height:32px;font-size:12px;font-weight:400;background:#f8fafc}
/* messages */
.msg{border-radius:var(--ds-radius-sm);padding:10px 14px;font-size:13px;border:1px solid transparent;margin:8px 0}
.msg:not(.err){background:var(--ds-ok-soft);color:var(--ds-ok);border-color:#bbf7d0}
.msg.err{background:var(--ds-err-soft);color:var(--ds-err);border-color:#fecaca}
.field-missing input,.field-missing select,.field-missing textarea{border-color:var(--ds-err);background:#fff8f8}
.field-missing label{color:var(--ds-err)}
/* tables: one look, light data, bold headings */
.list-table{border-collapse:separate;border-spacing:0;width:100%;border:1px solid var(--ds-line);border-radius:var(--ds-radius-sm);overflow:hidden}
.list-table th{background:#f1f5f9;color:var(--ds-ink);font-weight:800;padding:10px 8px;text-align:right;vertical-align:top;border-bottom:1px solid var(--ds-line)}
.list-table td{padding:9px 8px;font-weight:400;border-bottom:1px solid #eef2f6;font-size:13px}
.list-table tr:last-child td{border-bottom:0}
.list-table tr:hover td{background:#f8fbfa}
.list-table td.acts{white-space:nowrap}
.list-table td.acts button{margin-inline-start:4px}
.list-table tr.bad td{background:var(--ds-err-soft)}
table{font-family:var(--ds-font)}
/* badges */
.chip,.occ{border-radius:999px}
/* pager and bulk bar */
.pager{border-top:1px solid var(--ds-line);margin-top:12px;padding-top:12px;justify-content:center;flex-wrap:nowrap;gap:8px;align-items:center}
.pager select.pg-size{width:auto!important;min-width:150px;flex:0 0 auto}
.pager button{white-space:nowrap}
.pg-info{font-size:12px;color:var(--ds-mute);font-weight:600;margin-inline-end:0}
.bulk-bar{min-height:0}
.bulk-bar:empty{display:none}
/* forms grid */
.fgrid{gap:14px 18px}
.card>.field,.fgrid>.field{margin-bottom:0}
/* login */
.login .card{box-shadow:0 20px 50px -20px rgba(15,23,42,.25)}
/* scrollbars */
*{scrollbar-width:thin;scrollbar-color:#cbd5e1 transparent}
/* print: plain white */
@media print{.card{box-shadow:none;border:0}}
/* ---- the side menu folds away with one button ---- */
body.side-collapsed{--side:0px}
body.side-collapsed .sidebar{overflow:hidden!important;visibility:hidden;padding:0!important;border:0!important;min-width:0!important}
#side-toggle{position:fixed;top:76px;inset-inline-start:12px;z-index:60;box-shadow:0 6px 18px -8px rgba(15,23,42,.35);background:#fff}
/* ---- readable text: regular for data and menus, bold for titles (light faces are not on most systems) ---- */
body,td,th,li,p,label,input,select,textarea,button,.muted,.hint,.list-table td{font-weight:400}
.sidebar .item,.sidebar a{font-size:14px;font-weight:500}
h1,h2,h3,h4,.th-title,.list-table th{font-weight:800}
/* ---- wide tables and grids scroll inside their box instead of running off the page ---- */
.card{min-width:0;overflow-x:auto}
.layout>main,.layout>div{min-width:0}
.card table{max-width:none}
/* ---- the text editor: one bar, a writing area that takes text at once, a formula panel with a preview ---- */
.rte{min-height:180px;padding:12px 14px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;line-height:1.9;outline:none;cursor:text}
.rte:focus{border-color:var(--ds-brand-2,#14806b);box-shadow:0 0 0 3px rgba(20,128,107,.15)}
.rte:empty:before{content:attr(data-placeholder);color:#94a3b8}
.rte-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.rte-bar input[type=color]{width:38px;height:34px;padding:2px;border-radius:8px}
.fx-panel{border:1px solid #cbd5e1;border-radius:10px;padding:10px;margin-bottom:8px;background:#f8fafc}
.fx-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fx-row .fx-in{flex:1 1 260px;min-width:200px}
.fx-sym{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.fx-sym button{min-width:34px;padding:4px 6px;font-size:15px}
.fx-preview{min-height:36px;padding:6px 8px;background:#fff;border:1px dashed #cbd5e1;border-radius:8px;font-size:17px}
.fx{direction:ltr;unicode-bidi:isolate;display:inline-block;padding:0 3px;font-family:"Cambria Math","Times New Roman",serif;font-size:1.05em}
.fx sup,.fx-preview sup{font-size:.7em;vertical-align:super}
.fx sub,.fx-preview sub{font-size:.7em;vertical-align:sub}
.fx-bar{border-top:1px solid currentColor;padding:0 2px}
/* ---- answer boxes: a compact ribbon that fits the box; the font name and size share one row ---- */
.rte-wrap{width:100%;min-width:0}
.rte-bar{font-size:12px;gap:4px;padding:6px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc}
.rte-bar button{padding:3px 7px;min-height:28px;font-size:12px;line-height:1.4}
.rte-bar input[type=color]{width:30px;height:28px}
.rte-fonts{display:flex;flex-wrap:nowrap;gap:6px;width:100%}
.rte-fonts select{flex:1 1 0;min-width:0;height:32px;font-size:12px}
.rte-bar select{height:32px;font-size:12px}
.rte{min-height:90px;font-size:14px}
/* ---- a question's form takes the full width: its fields in rows, its answer list under them (not in a narrow column) ---- */
.q{display:block!important;width:100%;min-width:0;grid-column:1/-1}
.q>div,.q>.field,.q>p,.q>button{width:100%;display:block;margin-inline:0;min-width:0}
.q>button{width:auto;display:inline-block}
.q .row{display:flex!important;flex-wrap:wrap;gap:12px;align-items:flex-start}
.q .row>*{flex:1 1 240px;min-width:0}
.q>div>.q-rows,.q .q-rows{width:100%}
/* ---- the answer rows of every question type (choices, pairs, short answers, drag items) use the full width ---- */
.q-rows{width:100%;display:block}
.q-rows>div{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-start;width:100%;margin-bottom:10px;padding:8px;border:1px solid #e2e8f0;border-radius:10px;box-sizing:border-box}
.q-rows>div>*{min-width:0;box-sizing:border-box}

.q-rows>div>input[type=text],.q-rows>div>input[type=number]{flex:0 1 180px}
.q-rows>div>label{display:flex;align-items:center;gap:4px}
/* ---- answer rows: letter (الف، ب، پ …), the answer, the percentage and the remove button; they wrap on a small screen ---- */
.ans-row{display:flex!important;flex-wrap:wrap;gap:8px 10px;align-items:flex-start;padding:10px;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:10px;background:#fff;width:100%;box-sizing:border-box}
.ans-letter{flex:0 0 auto;min-width:44px;font-weight:800;padding-top:8px;color:var(--ds-brand,#0f5c4d)}
.ans-row>input[type=checkbox]{flex:0 0 auto;margin-top:10px;width:18px;height:18px}
.ans-row>.rte-wrap{flex:1 1 320px;min-width:0}
.ans-row>input[type=text]{flex:1 1 220px;min-width:0}
.ans-row>.field{flex:0 0 130px;margin:0;min-width:0}
.ans-row>.field input{width:100%}
.ans-row>button{flex:0 0 auto;margin-top:4px}
@media (max-width:640px){.ans-row>.rte-wrap,.ans-row>input[type=text],.ans-row>.field{flex:1 1 100%}}
/* ---- the editor's ribbon and formula panel are closed by default and open with one click ---- */
.rte-head{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.rte-head button{font-size:12px;padding:4px 10px;min-height:30px}
.rte-wrap .rte-bar{margin-bottom:6px}
.rte-wrap .fx-panel{margin-bottom:6px}

.chip{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;color:#fff}.chip-ok{background:#1e8449}.chip-bad{background:#c0392b}.chip-none{background:#7f8c8d}.conn-form{border:1px solid #c9d6d2;border-radius:10px;padding:8px;margin:8px 0;background:#fbfdfc}

.day-head{background:#1d6f5f;color:#fff}.site-search-hit{color:#1d2b28 !important;background:#fff !important;border:none !important;border-bottom:1px solid #d9e6e2 !important;display:block;width:100%;text-align:right;padding:8px 10px}.site-search-results button{color:#1d2b28 !important}

.exam-cal td.cal-cell{min-width:150px;max-width:230px;vertical-align:top}
.exam-cal th{min-width:110px}
.exam-cal th{font-size:10.5px;word-break:break-word}
.exam-cal .cal-exam{border-radius:6px;padding:2px 3px;margin:2px 0;line-height:1.5}
.exam-cal .cal-exam b{font-size:10.5px}
.exam-cal .cal-exam .muted{font-size:9.5px}
.exam-cal .cal-exam button{font-size:9.5px;padding:1px 4px}
.exam-cal th.cal-date{width:70px}
/* ---- class worksheet: course titles written vertically so every course fits on one page ---- */
.ws-table th.vtitle{writing-mode:vertical-rl;transform:rotate(180deg);min-width:26px;max-height:240px;white-space:nowrap;padding:6px 2px}
/* ---- bells and ticks as rows (wrapping), not columns ---- */
.bell-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.bell-tile{display:inline-flex;align-items:center;gap:8px;border:1px solid #c9d6d2;border-radius:10px;padding:6px 10px;background:#fff}
.bell-tile b{white-space:nowrap}
/* ---- a box with an error: red border and a short message under it ---- */
.field.field-err input,.field.field-err select,.field.field-err textarea{border:2px solid #dc2626 !important;background:#fef2f2}
.field-msg{color:#b91c1c;font-size:12.5px;font-weight:700;margin-top:4px}
/* ---- pager, bulk actions ---- */
.bulk-bar{margin:8px 0;min-height:34px}
.pager{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.pg-info{font-weight:400;font-size:13px;margin-inline-end:auto}
.pg-size{padding:4px 8px;border-radius:10px}
button[disabled]{opacity:.45;cursor:not-allowed}
/* ---- lists: one table, filters in the headings; titles bold, data light (organisational look) ---- */
.list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.list-table{width:100%;font-size:13px}
.list-table th{vertical-align:top;text-align:right;padding:8px 6px;background:var(--brand-soft);color:var(--ink);font-weight:800}
.th-title{font-weight:800;margin-bottom:6px;font-family:Titr,Zar,"Sans Serif",Tahoma,sans-serif}
.col-filter{width:100%;min-width:90px;padding:4px 6px;font-size:12px;font-weight:400}
.list-table td{padding:7px 6px;font-weight:400;border-bottom:1px solid var(--line)}
.list-table td.acts{white-space:nowrap}
.list-table button.danger{color:var(--err);border-color:var(--err)}
.row-count{margin:6px 0}
h1,h2,h3,.tile .tn,.th-title{font-weight:800}
body,td,.muted,.hint{font-weight:400}
/* ---- visual refresh: softer surfaces, clearer focus, calmer tables and buttons ---- */
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-weight:400;font-size:14px;line-height:1.7}
.card{border-radius:16px;box-shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px -12px rgba(15,23,42,.12);transition:box-shadow .2s ease}
.card:hover{box-shadow:0 1px 2px rgba(15,23,42,.06),0 14px 32px -14px rgba(15,23,42,.18)}
button{transition:background-color .15s ease,box-shadow .15s ease,transform .05s ease;border-radius:10px}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent)}
input,select,textarea{border-radius:10px;transition:border-color .15s ease,box-shadow .15s ease}
table{border-collapse:separate;border-spacing:0;overflow:hidden;border-radius:12px}
th{font-weight:700;font-size:13px;color:var(--mute)}
tr:hover td{background:color-mix(in srgb,var(--brand-soft) 45%,transparent)}
.sidebar .item{border-radius:10px;transition:background-color .15s ease}
.sidebar .item:hover{background:var(--brand-soft)}
.tile{border-radius:16px;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.tl{font-size:13px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.topbar,.sidebar{display:none}.layout{display:block}.content{padding:0}.card{box-shadow:none}}
</style>

<body>
<div id="app"></div>
<script nonce="{{ nonce }}">(function(){try{var t=localStorage.getItem('lms_theme')||'system';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<script nonce="{{ nonce }}">window.LMS_PANEL = "{{ panel|default:'app'|escapejs }}";</script>
<script nonce="{{ nonce }}">
{% verbatim %}
(function () {
  'use strict';
  var access = null, me = null, tab = 'profile', timerId = null;
  var REF = 'lms_refresh';
  var root = document.getElementById('app');

  /* ===================== Jalali (Shamsi) calendar ===================== */
  var JMONTHS = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
  var GDAYS = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
  function toFa(s) { return String(s).replace(/\d/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'.charAt(d); }); }
  function g2j(gy, gm, gd) {
    var gy2 = gm > 2 ? gy + 1 : gy;
    var days = 355666 + 365 * gy + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) + Math.floor((gy2 + 399) / 400) + gd + GDAYS[gm - 1];
    var jy = -1595 + 33 * Math.floor(days / 12053); days %= 12053;
    jy += 4 * Math.floor(days / 1461); days %= 1461;
    if (days > 365) { jy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
    var jm, jd;
    if (days < 186) { jm = 1 + Math.floor(days / 31); jd = 1 + days % 31; }
    else { jm = 7 + Math.floor((days - 186) / 30); jd = 1 + (days - 186) % 30; }
    return [jy, jm, jd];
  }
  function j2g(jy, jm, jd) {
    jy += 1595;
    var days = -355668 + 365 * jy + Math.floor(jy / 33) * 8 + Math.floor(((jy % 33) + 3) / 4) + jd;
    days += jm < 7 ? (jm - 1) * 31 : (jm - 7) * 30 + 186;
    var gy = 400 * Math.floor(days / 146097); days %= 146097;
    if (days > 36524) { days--; gy += 100 * Math.floor(days / 36524); days %= 36524; if (days >= 365) days++; }
    gy += 4 * Math.floor(days / 1461); days %= 1461;
    if (days > 365) { gy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
    var gd = days + 1, leap = (gy % 4 === 0 && gy % 100 !== 0) || gy % 400 === 0;
    var md = [0, 31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31], gm = 0;
    while (gm < 13 && gd > md[gm]) { gd -= md[gm]; gm++; }
    return [gy, gm, gd];
  }
  function jLeap(jy) { var g = j2g(jy, 12, 30), b = g2j(g[0], g[1], g[2]); return b[0] === jy && b[1] === 12 && b[2] === 30; }
  function jDays(jy, jm) { return jm <= 6 ? 31 : (jm <= 11 ? 30 : (jLeap(jy) ? 30 : 29)); }
  /* ===== tick-box list: a box beside every item (click the name or the box), and one box to select all ===== */
  function tickPick(items, selected) {
    var box = el('div', { 'class': 'tick-list' }), all = el('input', { type: 'checkbox' }), boxes = [], ids = {};
    (selected || []).forEach(function (x) { ids[String(x)] = 1; });
    var head = el('label', { 'class': 'tick tick-all' }, [all, document.createTextNode(' انتخاب همه')]);
    function refresh() { all.checked = boxes.length > 0 && boxes.every(function (b) { return b.checked; }); }
    all.addEventListener('change', function () { boxes.forEach(function (b) { b.checked = all.checked; }); });
    function fill(list, chosen) {
      clear(box); boxes = []; ids = {};
      (chosen || []).forEach(function (x) { ids[String(x)] = 1; });
      box.append(head);
      (list || []).forEach(function (it) {
        var cb = el('input', { type: 'checkbox', value: String(it.id) });
        cb.checked = !!ids[String(it.id)];
        cb.addEventListener('change', refresh);
        boxes.push(cb);
        box.append(el('label', { 'class': 'tick' }, [cb, document.createTextNode(' ' + it.label)]));
      });
      if (!boxes.length) box.append(el('p', { 'class': 'muted', text: 'موردی برای انتخاب نیست.' }));
      refresh();
    }
    fill(items, selected);
    return {
      node: box,
      get: function () { return boxes.filter(function (b) { return b.checked; }).map(function (b) { return Number(b.value); }); },
      reset: function (list, chosen) { fill(list, chosen); }
    };
  }

  /* ===== search boxes in lists keep the typing: the list is redrawn, and the box that had the cursor gets it back ===== */
  function filterFocusState(filters) {
    var ae = document.activeElement, key = null;
    Object.keys(filters || {}).forEach(function (k) { if (filters[k] === ae) key = k; });
    return key === null ? null : { key: key, pos: ae.selectionStart };
  }
  function filterFocusRestore(st, filters) {
    if (!st || !filters[st.key]) return;
    var f = filters[st.key];
    f.focus();
    var p = st.pos == null ? f.value.length : Math.min(st.pos, f.value.length);
    try { f.setSelectionRange(p, p); } catch (e) { }
  }

  // a combo box can be searched: type a code, a name or a class and only the matching choices remain
  function normSearch(x) {
    return String(x == null ? '' : x).replace(/[۰-۹]/g, function (d) { return String(d.charCodeAt(0) - 1776); })
      .replace(/ي/g, 'ی').replace(/ك/g, 'ک').replace(/\u200c/g, ' ').trim().toLowerCase();
  }
  function searchableSelect(s0) {
    var box = el('input', { type: 'text', 'class': 'fa', placeholder: 'جستجو (نام، کد یا کلاس)…' });
    var original = Array.prototype.slice.call(s0.options).map(function (o) { return { value: o.value, text: o.text }; });
    box.addEventListener('input', function () {
      var q2 = normSearch(box.value), keep = s0.value;
      clear(s0);
      original.forEach(function (o) { if (!q2 || normSearch(o.text).indexOf(q2) >= 0 || o.value === '') s0.append(el('option', { value: o.value, text: o.text })); });
      if (Array.prototype.some.call(s0.options, function (o) { return o.value === keep; })) s0.value = keep;
    });
    return el('div', null, [box, s0]);
  }
  function fmtDate(s) {
    if (!s) return '—';
    var p = String(s).slice(0, 10).split('-').map(Number), j = g2j(p[0], p[1], p[2]);
    return toFa(j[0] + '/' + pad(j[1]) + '/' + pad(j[2])) + ' (' + String(s).slice(0, 10) + ')';
  }

  /* A date (optionally with time) input that shows BOTH calendars; `.value` is the Gregorian
     'YYYY-MM-DD' or 'YYYY-MM-DDTHH:mm' string, exactly like a native input. */
  /* ---- Jalali date picker (modern): click to open a month grid; no typing. Value: YYYY-MM-DD, or YYYY-MM-DDTHH:mm with time. ---- */
  function dualInput(withTime) {
    var holder = el('div', { 'class': 'jp' });
    var shown = el('input', { type: 'text', readonly: 'readonly', 'class': 'fa jp-in', placeholder: 'تاریخ را از تقویم انتخاب کنید' });
    var timeIn = withTime ? el('input', { type: 'time', 'class': 'jp-time', step: '60' }) : null;
    var pop = el('div', { 'class': 'jp-pop hide' });
    pop.addEventListener('click', function (e) { e.stopPropagation(); });   // month buttons redraw the calendar: keep it open
    var iso = '', view = null;
    function label() {
      if (!iso) { shown.value = ''; return; }
      var p = iso.split('-').map(Number), j = g2j(p[0], p[1], p[2]);
      shown.value = toFa(j[0] + '/' + pad(j[1]) + '/' + pad(j[2])) + '  ' + JMONTHS[j[1] - 1];
    }
    function pick(gs) { iso = gs; label(); pop.classList.add('hide'); holder.dispatchEvent(new Event('change')); }
    function draw() {
      clear(pop);
      var jy = view[0], jm = view[1], days = jDays(jy, jm), a = j2g(jy, jm, 1), firstIdx = (new Date(a[0], a[1] - 1, a[2]).getDay() + 1) % 7;
      var head = el('div', { 'class': 'jp-head' }, [
        el('button', { type: 'button', 'class': 'jp-nav', text: '›', title: 'سال قبل', onclick: function () { view[0]--; draw(); } }),
        el('button', { type: 'button', 'class': 'jp-nav', text: '‹', title: 'ماه قبل', onclick: function () { if (view[1] === 1) { view[1] = 12; view[0]--; } else view[1]--; draw(); } }),
        el('b', { text: JMONTHS[jm - 1] + ' ' + toFa(String(jy)) }),
        el('button', { type: 'button', 'class': 'jp-nav', text: '›', title: 'ماه بعد', onclick: function () { if (view[1] === 12) { view[1] = 1; view[0]++; } else view[1]++; draw(); } }),
        el('button', { type: 'button', 'class': 'jp-nav', text: '‹', title: 'سال بعد', onclick: function () { view[0]++; draw(); } })]);
      var grid = el('div', { 'class': 'jp-grid' }, WD.map(function (nm, i) { return el('span', { 'class': 'jp-wd' + (i === 6 ? ' fri' : ''), text: nm }); }));
      for (var i = 0; i < firstIdx; i++) grid.append(el('span'));
      for (var d = 1; d <= days; d++) {
        (function (day) {
          var g = j2g(jy, jm, day), gs = g[0] + '-' + pad(g[1]) + '-' + pad(g[2]);
          var cls = 'jp-day' + (gs === iso ? ' on' : '') + (gs === today() ? ' today' : '') + ((grid.childNodes.length % 7) === 6 ? ' fri' : '');
          grid.append(el('button', { type: 'button', 'class': cls, text: toFa(String(day)), onclick: function () { pick(gs); } }));
        })(d);
      }
      pop.append(head, grid, el('div', { 'class': 'jp-foot' }, [
        el('button', { type: 'button', 'class': 's', text: 'امروز', onclick: function () { var t = today().split('-').map(Number), j = g2j(t[0], t[1], t[2]); view = [j[0], j[1]]; pick(today()); } }),
        el('button', { type: 'button', 'class': 's', text: 'پاک کردن', onclick: function () { iso = ''; label(); pop.classList.add('hide'); } }),
        el('button', { type: 'button', 'class': 's', text: 'بستن', onclick: function () { pop.classList.add('hide'); } })]));
    }
    function open() {
      if (!view) {
        var base = iso ? iso.split('-').map(Number) : today().split('-').map(Number), j = g2j(base[0], base[1], base[2]);
        view = [j[0], j[1]];
      }
      draw(); pop.classList.remove('hide');
    }
    function place() {
      // drawn in the page layer (not inside the card), so it is never cut off by a card or a scrolling panel
      var r = shown.getBoundingClientRect(), w = 300, left = Math.min(Math.max(8, r.right - w), window.innerWidth - w - 8);
      pop.style.position = 'fixed'; pop.style.top = Math.min(r.bottom + 6, window.innerHeight - 340) + 'px'; pop.style.left = left + 'px'; pop.style.width = w + 'px';
      pop.style.insetInlineStart = 'auto';
    }
    var origOpen = open;
    open = function () { document.body.append(pop); origOpen(); place(); };
    shown.addEventListener('click', function (e) { e.stopPropagation(); if (pop.classList.contains('hide')) open(); else pop.classList.add('hide'); });
    document.addEventListener('click', function (e) { if (!holder.contains(e.target) && !pop.contains(e.target)) pop.classList.add('hide'); });
    window.addEventListener('resize', function () { if (!pop.classList.contains('hide')) place(); });
    holder.append(el('div', { 'class': 'jp-row' }, [shown, timeIn]));
    Object.defineProperty(holder, 'value', {
      get: function () { if (!iso) return ''; return withTime ? iso + 'T' + (timeIn.value || '00:00') : iso; },
      set: function (v) {
        v = String(v || '');
        iso = v.slice(0, 10).match(/^\d{4}-\d{2}-\d{2}$/) ? v.slice(0, 10) : '';
        if (withTime && timeIn) timeIn.value = v.length >= 16 ? v.slice(11, 16) : '';
        view = null; label();
      }
    });
    return holder;
  }

  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    for (var k in (attrs || {})) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c !== null && c !== undefined) e.append(c); });
    return e;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function fmt(s) {
    if (!s) return '—';
    var d = new Date(s), j = g2j(d.getFullYear(), d.getMonth() + 1, d.getDate());
    return toFa(j[0] + '/' + pad(j[1]) + '/' + pad(j[2]) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes())) +
      ' (' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ')';
  }
  function msg(text, err) { return el('div', { 'class': 'msg' + (err ? ' err' : ''), text: text }); }
  function errText(r) {
    if (r.status === 429) return 'تعداد درخواست‌ها زیاد است؛ کمی بعد دوباره تلاش کنید.';
    if (r.status === 409) return 'این عملیات قبلاً انجام شده یا وضعیت آن تغییر کرده است؛ صفحه را دوباره باز کنید و از نو پیش‌نمایش بگیرید.';
    if (r.status === 404) return 'این درخواست پیدا نشد (آدرس یا مدرسه‌ی انتخاب‌شده را بررسی کنید). اگر مشکل ادامه داشت، صفحه را با Ctrl+F5 باز کنید.';
    if (r.status === 403) return 'شما دسترسی لازم برای این کار را ندارید.';
    if (r.status === 405) return 'این عملیات برای این بخش پشتیبانی نمی‌شود.';
    var d = r.data || {};
    if (d.detail) return String(d.detail);
    var first = Object.keys(d)[0];
    if (first) return String([].concat(d[first])[0]);
    if (r.status >= 500) return 'خطای داخلی سرور (' + r.status + '). اطلاعات برای مدیر سیستم ثبت شد؛ یک بار دیگر تلاش کنید یا به مدیر سیستم اطلاع دهید.';
    return 'خطایی رخ داد (' + (r.status || '') + ').';
  }

  async function refresh() {
    var rt = sessionStorage.getItem(REF);
    if (!rt) return false;
    var r = await fetch('/api/auth/refresh/', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh: rt }) });
    if (!r.ok) { sessionStorage.removeItem(REF); access = null; return false; }
    var d = await r.json();
    access = d.access;
    if (d.refresh) sessionStorage.setItem(REF, d.refresh);
    return true;
  }
  async function api(path, method, body, noRetry) {
    var h = { 'Content-Type': 'application/json' };
    if (access) h['Authorization'] = 'Bearer ' + access;
    if (kartablId() && !(me && me.role === 'super_admin')) h['X-School-Id'] = kartablId();
    var r = await fetch(path, { method: method || 'GET', headers: h, body: body ? JSON.stringify(body) : undefined });
    if (r.status === 401 && !noRetry && access) {
      if (await refresh()) return api(path, method, body, true);
    }
    if (r.status === 401 && me) { sessionExpired(); }
    var data = null;
    try { data = await r.json(); } catch (e) { data = null; }
    return { ok: r.ok, status: r.status, data: data };
  }
  // the values of the open page (texts, selections, ticks) are kept in the browser while the login is renewed
  function snapshotDraft() {
    var m = window.__curMain; if (!m) return;
    var vals = [];
    m.querySelectorAll('input, textarea, select').forEach(function (x) {
      if (x.type === 'password') return;
      vals.push(x.type === 'checkbox' ? !!x.checked : x.value);
    });
    try { sessionStorage.setItem('lms_draft', JSON.stringify({ tab: tab, vals: vals, at: Date.now() })); } catch (e) {}
  }
  function restoreDraft() {
    var raw = null; try { raw = sessionStorage.getItem('lms_draft'); } catch (e) {}
    if (!raw) return;
    var d = JSON.parse(raw); sessionStorage.removeItem('lms_draft');
    if (!d || d.tab !== tab || !window.__curMain || Date.now() - d.at > 30 * 60 * 1000) return;
    setTimeout(function () {
      var fields = window.__curMain.querySelectorAll('input, textarea, select'), k = 0;
      fields.forEach(function (x) {
        if (x.type === 'password' || k >= d.vals.length) return;
        if (x.type === 'checkbox') x.checked = !!d.vals[k]; else if (d.vals[k] !== '' && x.value === '') x.value = d.vals[k];
        k++;
      });
    }, 1200);
  }
  function sessionExpired() {
    if (window.__expiring) return; window.__expiring = true;
    snapshotDraft();
    sessionStorage.removeItem(REF); access = null; me = null;
    renderLogin('نشست شما پایان یافت. اگر با همین حساب در جای دیگری وارد شده‌اید، ورود قبلی بسته شده است. دوباره وارد شوید تا همان صفحه و اطلاعات وارد‌شده ادامه پیدا کند.');
    window.__expiring = false;
  }
  function rows(r) { return r.ok && r.data ? (Array.isArray(r.data) ? r.data : (r.data.results || [])) : []; }

  function renderLogin(note) {
    stopTimer(); clear(root);
    var u = el('input', { type: 'text', autocomplete: 'username', required: 'required' });
    var p = el('input', { type: 'password', autocomplete: 'current-password', required: 'required' });
    var otp = el('input', { type: 'text', inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: '6' });
    var otpRow = el('div', { 'class': 'hide' }, [el('label', { text: 'کد تأیید دو مرحله‌ای (برنامه احراز هویت)' }), otp]);
    var out = el('div');
    var btn = el('button', { 'class': 'p', type: 'submit', text: 'ورود' });
    var form = el('form', { onsubmit: async function (ev) {
      ev.preventDefault(); clear(out); btn.disabled = true;
      sessionStorage.removeItem(REF); access = null;
      var body = { username: u.value.trim(), password: p.value };

  /* ===================== Server monitor (پایش سرور): system administrator only ===================== */
  function lineChart(series, opts) {
    // series: [{name, color, values:[...]}]; draws a simple line chart with axes and a legend
    var W = 720, H = 220, P = 36;
    var all = []; series.forEach(function (s0) { s0.values.forEach(function (v) { all.push(v); }); });
    var max = Math.max(opts.max || 0, Math.max.apply(null, all.concat([1])));
    var n = Math.max.apply(null, series.map(function (s0) { return s0.values.length; }).concat([2]));
    var ns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(ns, 'svg'); svg.setAttribute('viewBox', '0 0 ' + W + ' ' + (H + 40)); svg.style.width = '100%'; svg.style.height = 'auto';
    function line(x1, y1, x2, y2, c) { var l = document.createElementNS(ns, 'line'); l.setAttribute('x1', x1); l.setAttribute('y1', y1); l.setAttribute('x2', x2); l.setAttribute('y2', y2); l.setAttribute('stroke', c || '#999'); svg.appendChild(l); }
    function text(x, y, s0) { var tx = document.createElementNS(ns, 'text'); tx.setAttribute('x', x); tx.setAttribute('y', y); tx.setAttribute('font-size', '11'); tx.textContent = s0; svg.appendChild(tx); }
    line(P, P, P, H, '#333'); line(P, H, W - 10, H, '#333');
    [0, 0.5, 1].forEach(function (f) { var y = H - f * (H - P); line(P, y, W - 10, y, '#eee'); text(2, y + 4, String(Math.round(f * max))); });
    series.forEach(function (s0) {
      var pts = s0.values.map(function (v, i) { var x = P + (i / Math.max(n - 1, 1)) * (W - P - 20); var y = H - (v / max) * (H - P); return x.toFixed(1) + ',' + y.toFixed(1); }).join(' ');
      var pl = document.createElementNS(ns, 'polyline'); pl.setAttribute('points', pts); pl.setAttribute('fill', 'none'); pl.setAttribute('stroke', s0.color); pl.setAttribute('stroke-width', '2'); svg.appendChild(pl);
    });
    series.forEach(function (s0, k) { line(P + k * 150, H + 22, P + k * 150 + 16, H + 22, s0.color); text(P + k * 150 + 20, H + 26, s0.name); });
    var wrap = el('div', { 'class': 'chart' }); wrap.append(el('b', { text: opts.title })); wrap.append(svg);
    return wrap;
  }

  /* ---- voice recording (browser MediaRecorder) → uploaded as a file; plays back in the content and submissions ---- */
  function voiceRecorder(onFile) {
    var btn = el('button', { 'class': 's', type: 'button', text: '🎙 ضبط صدا' }), status = el('span', { 'class': 'muted' });
    var rec = null, chunks = [], stream = null;
    btn.addEventListener('click', async function () {
      if (rec && rec.state === 'recording') { rec.stop(); return; }
      if (!navigator.mediaDevices || !window.MediaRecorder) { status.textContent = 'مرورگر ضبط صدا را پشتیبانی نمی‌کند.'; return; }
      try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
      catch (e) { status.textContent = 'اجازه دسترسی به میکروفون داده نشد.'; return; }
      chunks = []; rec = new MediaRecorder(stream);
      rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = async function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        btn.textContent = '🎙 ضبط صدا';
        var blob = new Blob(chunks, { type: 'audio/webm' });
        if (blob.size > 25 * 1024 * 1024) { status.textContent = 'ضبط بیش از حد طولانی است.'; return; }
        status.textContent = 'در حال ذخیره صدا…';
        var r = await uploadFile(new File([blob], 'voice-' + Date.now() + '.webm', { type: 'audio/webm' }));
        if (r.ok) { status.textContent = 'صدا ذخیره شد.'; if (onFile) onFile(r.data); } else status.textContent = errText(r);
      };
      rec.start(); btn.textContent = '⏹ توقف ضبط'; status.textContent = 'در حال ضبط…';
    });
    return el('span', null, [btn, ' ', status]);
  }

  // a plain search box in the header: matching pages are listed right under it (debounced, so typing stays fast)
  function siteSearch(groups) {
    var wrap = el('div', { 'class': 'site-search' });
    var input = el('input', { type: 'search', 'class': 'fa site-search-input', placeholder: 'جستجو در سایت…', 'aria-label': 'جستجو در سایت', autocomplete: 'off' });
    var list = el('div', { 'class': 'site-search-results', role: 'listbox' });
    var all = [];
    (groups || []).forEach(function (g) { g.items.forEach(function (i) { all.push({ key: i.key, label: i.label, group: g.t, hay: (i.label + ' ' + g.t).toLowerCase() }); }); });
    var timer = null;
    function close() { list.style.display = 'none'; clear(list); }
    function draw() {
      var q = input.value.trim().toLowerCase();
      clear(list);
      if (!q) return close();
      var hits = all.filter(function (x) { return x.hay.indexOf(q) >= 0; }).slice(0, 8);
      list.style.display = '';
      if (!hits.length) { list.append(el('div', { 'class': 'site-search-empty', text: 'صفحه‌ای با این نام پیدا نشد.' })); return; }
      hits.forEach(function (h) {
        list.append(el('button', { type: 'button', 'class': 'site-search-hit', text: h.label + '  —  ' + h.group, onclick: function () {
          input.value = ''; close();
          if (window.LMS_GO) window.LMS_GO(h.key);
        } }));
      });
    }
    input.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(draw, 120); });
    input.addEventListener('keydown', function (e) { if (e.key === 'Escape') { input.value = ''; close(); } });
    input.addEventListener('blur', function () { setTimeout(close, 180); });
    input.addEventListener('focus', draw);
    close();
    var lbl = el('span', { text: 'جستجو:', style: 'color:#fff;font-size:12px;margin-inline-end:4px' });
    wrap.append(lbl, input, list);
    return wrap;

  /* address picker: province -> county (cascade). Region (ناحیه/منطقه) is a separate picker. */
  function geoPicker(regionId, chain, onChange) {
    var prov = el('select'), county = el('select'), region = el('select');
    var admin = isAdminRole();
    function fill(sel, list, placeholder) {
      clear(sel); sel.append(el('option', { value: '', text: placeholder }));
      list.forEach(function (o) { sel.append(el('option', { value: String(o.id), text: o.name })); });
    }
    async function counties(p) { var r = await api('/api/geo/?parent=' + p); return r.ok ? r.data.filter(function (x) { return x.kind === 'county'; }) : []; }
    async function regions(filter) { var r = await api('/api/geo/regions/?' + filter); return r.ok ? r.data : []; }
    async function onProv() {
      fill(county, prov.value ? await counties(prov.value) : [], '— شهرستان —');
      fill(region, prov.value ? await regions('province=' + prov.value) : [], '— ناحیه / منطقه —');
      onChange({ county: null, region: null });
    }
    async function onCounty() {
      var rs = county.value ? await regions('county=' + county.value) : [];
      fill(region, rs.length ? rs : (prov.value ? await regions('province=' + prov.value) : []), '— ناحیه / منطقه —');
      onChange({ county: county.value ? Number(county.value) : null, region: null });
    }
    prov.addEventListener('change', onProv);
    county.addEventListener('change', onCounty);
    region.addEventListener('change', function () { onChange({ county: county.value ? Number(county.value) : null, region: region.value ? Number(region.value) : null }); });
    async function init() {
      var pr = await api('/api/geo/');
      if (!isSuperRole() && chain && chain.province_id) { fill(prov, [{ id: chain.province_id, name: chain.province || '' }], '— استان —'); prov.value = String(chain.province_id); }
      else fill(prov, pr.ok ? pr.data : [], '— استان —');
      if (chain && chain.province_id) prov.value = String(chain.province_id);
      fill(county, chain && chain.province_id ? await counties(chain.province_id) : [], '— شهرستان —');
      if (chain && chain.county_id) county.value = String(chain.county_id);
      fill(region, chain && chain.province_id ? await regions((chain.county_id ? 'county=' + chain.county_id : 'province=' + chain.province_id)) : [], '— ناحیه / منطقه —');
      if (regionId) region.value = String(regionId);
      // a school is fixed to its own county and region: only that one is offered (super admin may change it)
      if (!isSuperRole() && chain && chain.county_id) {
        fill(county, [{ id: chain.county_id, name: chain.county }], '— شهرستان —'); county.value = String(chain.county_id); county.disabled = true;
      }
      if (!isSuperRole() && regionId) {
        fill(region, [{ id: regionId, name: chain.region || '' }], '— ناحیه / منطقه —'); region.value = String(regionId); region.disabled = true;
      }
      if (!isSuperRole() && chain && chain.province_id) { prov.disabled = true; }
      onChange({ county: chain && chain.county_id ? chain.county_id : null, region: regionId || null });
    }
    var add = el('div', { 'class': 'muted' });
    if (admin) {
      var nc = el('input', { type: 'text', 'class': 'fa', placeholder: 'نام شهرستان جدید' }), nco = el('div');
      var nr = el('input', { type: 'text', 'class': 'fa', placeholder: 'نام ناحیه/منطقه جدید' }), nro = el('div');
      add.append(el('p', null, [nc, el('button', { 'class': 's', type: 'button', text: 'افزودن شهرستان به این استان', onclick: async function () {
        clear(nco); var r = await api('/api/geo/counties/', 'POST', { name: nc.value.trim(), province: Number(prov.value) });
        if (r.ok) { nc.value = ''; fill(county, await counties(prov.value), '— شهرستان —'); county.value = String(r.data.id); onCounty(); } else nco.append(msg(errText(r), true));
      } }), nco]));
      var rn = el('input', { type: 'text', 'class': 'fa', placeholder: 'نام جدید شهرستان انتخاب‌شده' }), rno = el('div');
      add.append(el('p', null, [rn, el('button', { 'class': 's', type: 'button', text: 'تغییر نام شهرستان انتخاب‌شده', onclick: async function () {
        clear(rno); if (!county.value) { rno.append(msg('شهرستانی انتخاب نشده است.', true)); return; }
        var r = await api('/api/geo/counties/' + county.value + '/', 'PATCH', { name: rn.value.trim() });
        if (r.ok) { rn.value = ''; fill(county, await counties(prov.value), '— شهرستان —'); county.value = String(r.data.id); } else rno.append(msg(errText(r), true));
      } }), rno]));
      add.append(el('p', null, [nr, el('button', { 'class': 's', type: 'button', text: 'افزودن ناحیه/منطقه به شهرستان یا استان انتخاب‌شده', onclick: async function () {

(function sideToggle() {
  var KEY = 'lms_side_collapsed';
  function apply(on) { document.body.classList.toggle('side-collapsed', !!on); }
  apply(sessionStorage.getItem(KEY) === '1');
  if (document.getElementById('side-toggle')) return;
  function showIfMenu() { var b = document.getElementById('side-toggle'); if (b) b.style.display = document.querySelector('.sidebar') ? '' : 'none'; }
  setInterval(showIfMenu, 400);
  var b = document.createElement('button');
  b.id = 'side-toggle'; b.type = 'button'; b.className = 's'; b.textContent = '☰ منو';
  b.title = 'نمایش یا پنهان کردن منوی سمت راست';
  b.onclick = function () { var on = !document.body.classList.contains('side-collapsed'); apply(on); sessionStorage.setItem(KEY, on ? '1' : '0'); };
  document.body.appendChild(b);
  showIfMenu();
})();
