# Dev/staging reference. Production: separate hosts, Patroni for PostgreSQL, Redis Sentinel (see deployment doc).
x-app: &app
  build: .
  env_file: .env
  depends_on: [pgbouncer, redis-cache, redis-broker]
services:
  web:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
  worker:
    <<: *app
    command: celery -A config worker -Q default,grading -l info --concurrency 4
  beat:                      # exactly ONE instance
    <<: *app
    command: celery -A config beat -l info
  postgres:
    image: postgres:16
    environment: {POSTGRES_DB: lms, POSTGRES_USER: lms, POSTGRES_PASSWORD: change-me}
    volumes: [pgdata:/var/lib/postgresql/data]
  pgbouncer:
    image: edoburu/pgbouncer
    environment:
      DB_HOST: postgres
      DB_USER: lms
      DB_PASSWORD: change-me
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 50
      MAX_CLIENT_CONN: 2000
    depends_on: [postgres]
  redis-cache:
    image: redis:7
    command: redis-server --save "" --appendonly no --maxmemory 2gb --maxmemory-policy allkeys-lru
  redis-broker:
    image: redis:7
    command: redis-server --appendonly yes --appendfsync everysec
    volumes: [brokerdata:/data]
volumes: {pgdata: {}, brokerdata: {}}
